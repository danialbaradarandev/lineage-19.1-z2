name: Build LineageOS 19.1 for Xperia Z2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 lib32ncurses-dev lib32z1-dev lib32gcc-s1 lib32gcc-12-dev libx11-dev libreadline6-dev libxml2-dev libgl1-mesa-dev libssl-dev libncurses-dev x11proto-core-dev python3 python3-pip openjdk-17-jdk android-sdk-platform-tools adb fastboot bc bison ccache repo cpio pngcrush rsync schedtool squashfs-tools texinfo unzip xsltproc zip zlib1g-dev

      - name: Configure git
        run: |
          git config --global user.name "danialbaradarandev"
          git config --global user.email "danialbaradaran20@gmail.com"

      - name: Initialize repo and sync source
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Clone device tree and vendor blobs
        run: |
          cd ~/android/lineage
          git clone https://github.com/LineageOS/android_device_sony_sirius device/sony/sirius
          git clone https://github.com/LineageOS/android_device_sony_shinano-common device/sony/shinano-common
          git clone https://github.com/TheMuppets/proprietary_vendor_sony_sirius vendor/sony/sirius
          git clone https://github.com/TheMuppets/proprietary_vendor_sony_shinano-common vendor/sony/shinano-common

      - name: Setup build environment
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_sirius-userdebug

      - name: Build ROM
        run: |
          cd ~/android/lineage
          mka bacon

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: lineage-19.1-z2
          path: ~/android/lineage/out/target/product/sirius/*.zip
