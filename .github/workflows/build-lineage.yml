name: Build LineageOS 19.1 - Sony Xperia Z2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5 \
            x11proto-core-dev \
            libx11-dev \
            libreadline-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            unzip \
            fontconfig \
            python3

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LineageOS 19.1
        run: |
          mkdir -p ~/android
          cd ~/android
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-19.1 \
            --git-lfs

      - name: Sync source
        run: |
          cd ~/android
          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2

      - name: Add Sony device trees
        run: |
          cd ~/android

          git clone --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_device_sony_sirius.git \
            device/sony/sirius

          git clone --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_device_sony_msm8974-common.git \
            device/sony/msm8974-common

          git clone --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_device_sony_shinano-common.git \
            device/sony/shinano-common

          git clone --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_kernel_sony_msm8974.git \
            kernel/sony/msm8974

      - name: Add Sony dependencies
        run: |
          cd ~/android

          git clone --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_device_sony_common.git \
            device/sony/common

          git clone --depth=1 \
            -b lineage-18.1 \
            https://github.com/LineageOS/android_hardware_sony_thermanager.git \
            hardware/sony/thermanager

          git clone --depth=1 \
            -b lineage-19.1 \
            https://github.com/LineageOS/android_hardware_sony_timekeep.git \
            hardware/sony/timekeep

          git clone --depth=1 \
            -b lineage-19.1 \
            https://github.com/LineageOS/android_hardware_sony_macaddrsetup.git \
            hardware/sony/macaddrsetup

      - name: Prepare build
        run: |
          cd ~/android
          source build/envsetup.sh
          lunch lineage_sirius-userdebug

      - name: Build
        run: |
          cd ~/android
          source build/envsetup.sh
          lunch lineage_sirius-userdebug
          m bacon -j2
