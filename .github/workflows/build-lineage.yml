name: Build postmarketOS for Xperia Z2 (sony-sirius)

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'کدنیم دستگاه در pmaports'
        required: true
        default: 'sony-sirius'
      ui:
        description: 'رابط کاربری (none / x11 / weston / phosh / plasma-mobile ...)'
        required: true
        default: 'weston'
      channel:
        description: 'برنچ pmaports (معمولاً edge)'
        required: true
        default: 'master'
      patches_dir:
        description: 'پوشه‌ی پچ‌های اختیاری داخل همین ریپو (خالی = بدون پچ)'
        required: false
        default: 'patches'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # به سقف ۶ ساعته‌ی رانر رایگان نزدیک نشیم

    steps:
      - name: Checkout ریپوی خودمون (پچ‌های اختیاری)
        uses: actions/checkout@v4
        with:
          path: workflow-src

      - name: نصب پیش‌نیازهای pmbootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git openssl procps psmisc tar util-linux \
            e2fsprogs dosfstools parted multipath-tools \
            qemu-user-static binfmt-support ccache \
            python3 python3-pip

      - name: نصب pmbootstrap از سورس (روش رسمی)
        run: |
          git clone https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p "$HOME/.local/bin"
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: کلون pmaports (منبع رسمی بسته‌ها و دستگاه‌ها)
        run: |
          git clone --no-depth https://gitlab.postmarketos.org/postmarketOS/pmaports.git

      - name: اعمال پچ‌های اختیاری خودمون روی pmaports
        run: |
          PATCH_DIR="workflow-src/${{ inputs.patches_dir }}"
          if [ -d "$PATCH_DIR" ] && [ -n "$(ls -A "$PATCH_DIR" 2>/dev/null)" ]; then
            cd pmaports
            for p in "$GITHUB_WORKSPACE/$PATCH_DIR"/*.patch; do
              echo ":: applying $p"
              git apply --verbose "$p"
            done
          else
            echo ":: پوشه‌ی پچ خالیه یا وجود نداره — رد شدیم"
          fi

      - name: تنظیم غیرتعاملی pmbootstrap (بدون ویزارد init)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap config aports "$GITHUB_WORKSPACE/pmaports"
          pmbootstrap config device "${{ inputs.device }}"
          pmbootstrap config ui "${{ inputs.ui }}"
          pmbootstrap config user user
          pmbootstrap config hostname "${{ inputs.device }}"
          pmbootstrap config jobs "$(nproc)"
          pmbootstrap config ccache_size 5G
          pmbootstrap status

      # کش کردن work/ باعث میشه رران‌های بعدی خیلی سریع‌تر بشن
      - name: کش pmbootstrap work dir
        uses: actions/cache@v4
        with:
          path: ~/.local/var/pmbootstrap
          key: pmb-work-${{ inputs.device }}-${{ inputs.ui }}-${{ github.run_id }}
          restore-keys: |
            pmb-work-${{ inputs.device }}-${{ inputs.ui }}-

      - name: بیلد کرنل downstream دستگاه (اولین قدم مهم و کندتر)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap -y build linux-postmarketos-qcom-msm8974 --arch=armhf --force

      - name: بیلد بسته‌ی دیوایس sirius
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap -y build device-${{ inputs.device }} --arch=armhf --force

      - name: ساخت ایمیج نهایی (rootfs + kernel + boot.img)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pmbootstrap -y install --password "changeme123" --no-sshd=false

      - name: خروجی گرفتن (export) از فایل‌های نهایی
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/output"
          pmbootstrap export "$GITHUB_WORKSPACE/output"

      - name: آپلود artifact
        uses: actions/upload-artifact@v4
        with:
          name: postmarketos-${{ inputs.device }}-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: error
